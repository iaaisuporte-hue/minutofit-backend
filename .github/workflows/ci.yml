name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm test
        env:
          JWT_SECRET: ci-test-jwt-secret-placeholder-32chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-placeholder-32chars
          NODE_ENV: test
